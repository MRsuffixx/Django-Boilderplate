<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ site_name }}{% endblock %}</title>
  </head>
  <body style="margin:0;background:#f4f5f7;color:#172b4d;font-family:Arial,sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px">
      <tr><td align="center">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="max-width:600px;background:#fff;border-radius:8px;padding:32px">
          <tr><td><h1 style="font-size:22px;margin-top:0">{{ site_name }}</h1></td></tr>
          <tr><td>{% block content %}{% endblock %}</td></tr>
          <tr><td style="padding-top:24px;color:#6b778c;font-size:13px">Need help? Contact <a href="mailto:{{ support_email }}">{{ support_email }}</a>.</td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
