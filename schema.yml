components:
  schemas:
    APIKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        prefix:
          type: string
          readOnly: true
        scopes: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_used_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_used_ip:
          type: string
          readOnly: true
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        is_active:
          type: boolean
          readOnly: true
      required:
      - created_at
      - id
      - is_active
      - last_used_at
      - last_used_ip
      - name
      - prefix
      - revoked_at
    APIKeyRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes: {}
        expires_at:
          type: string
          format: date-time
          nullable: true
      required:
      - name
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        actor:
          type: string
          readOnly: true
        action:
          type: string
          readOnly: true
        target_type:
          type: string
          readOnly: true
        target_id:
          type: string
          readOnly: true
        target_repr:
          type: string
          readOnly: true
        before:
          readOnly: true
        after:
          readOnly: true
        metadata:
          readOnly: true
        request_id:
          type: string
          readOnly: true
        ip_address:
          type: string
          readOnly: true
          nullable: true
        user_agent:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor
      - after
      - before
      - created_at
      - id
      - ip_address
      - metadata
      - request_id
      - target_id
      - target_repr
      - target_type
      - user_agent
    ChangeEmail:
      type: object
      properties:
        new_email:
          type: string
          format: email
      required:
      - new_email
    ChangeEmailRequest:
      type: object
      properties:
        password:
          type: string
          writeOnly: true
          minLength: 1
        new_email:
          type: string
          format: email
          minLength: 1
      required:
      - new_email
      - password
    ChangePasswordRequest:
      type: object
      properties:
        old_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - new_password
      - old_password
    ChangeUsername:
      type: object
      properties:
        username:
          type: string
          maxLength: 150
          pattern: ^[\w.@+-]+$
      required:
      - username
    ChangeUsernameRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 150
          pattern: ^[\w.@+-]+$
      required:
      - username
    EffectEnum:
      enum:
      - allow
      - deny
      type: string
      description: |-
        * `allow` - Allow
        * `deny` - Deny
    Email:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    EmailRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    EventTypeEnum:
      enum:
      - login_success
      - login_failed
      - new_device_login
      - password_changed
      - password_reset
      - email_changed
      - two_factor_enabled
      - two_factor_disabled
      - recovery_code_used
      - session_revoked
      - account_locked
      - account_unlocked
      - account_deactivated
      - account_deleted
      - api_key_created
      - api_key_revoked
      type: string
      description: |-
        * `login_success` - Login successful
        * `login_failed` - Login failed
        * `new_device_login` - New device login
        * `password_changed` - Password changed
        * `password_reset` - Password reset
        * `email_changed` - Email changed
        * `two_factor_enabled` - Two-factor authentication enabled
        * `two_factor_disabled` - Two-factor authentication disabled
        * `recovery_code_used` - Recovery code used
        * `session_revoked` - Session revoked
        * `account_locked` - Account locked
        * `account_unlocked` - Account unlocked
        * `account_deactivated` - Account deactivated
        * `account_deleted` - Account deleted
        * `api_key_created` - API key created
        * `api_key_revoked` - API key revoked
    FeatureFlag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        key:
          type: string
          maxLength: 150
        enabled:
          type: boolean
        description:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - key
      - updated_at
    FeatureFlagRequest:
      type: object
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 150
        enabled:
          type: boolean
        description:
          type: string
      required:
      - key
    Login:
      type: object
      properties:
        identifier:
          type: string
          maxLength: 254
        remember_me:
          type: boolean
          default: false
      required:
      - identifier
    LoginRequest:
      type: object
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
        code:
          type: string
          writeOnly: true
          maxLength: 32
        remember_me:
          type: boolean
          default: false
      required:
      - identifier
      - password
    LogoutRequest:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        type:
          type: string
          readOnly: true
        title:
          type: string
          readOnly: true
        message:
          type: string
          readOnly: true
        data:
          readOnly: true
        is_read:
          type: boolean
          readOnly: true
        read_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
