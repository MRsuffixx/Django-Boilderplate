[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "django-foundation"
version = "0.1.0"
description = "Production-ready, reusable Django application foundation"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Project maintainers" }]
dependencies = [
  "Django[argon2]>=5.2.16,<5.3",
  "djangorestframework>=3.17.1,<3.18",
  "djangorestframework-simplejwt>=5.5.1,<5.6",
  "drf-spectacular>=0.29.0,<0.30",
  "django-filter>=25.1,<26",
  "django-cors-headers>=4.7,<5",
  "django-environ>=0.12,<0.13",
  "django-redis>=6.0,<7",
  "celery[redis]>=5.6.3,<5.7",
  "psycopg[binary]>=3.2.9,<4",
  "cryptography>=45,<47",
  "pyotp>=2.9,<3",
  "user-agents>=2.2,<3",
  "filetype>=1.2,<2",
  "Pillow>=11.3,<13",
  "httpx>=0.28,<0.29",
  "python-json-logger>=3.3,<5",
  "whitenoise>=6.9,<7",
]

[project.optional-dependencies]
production = [
  "boto3>=1.39,<2",
  "django-storages[s3]>=1.14.6,<2",
  "gunicorn>=23,<24",
  "sentry-sdk[celery,django]>=2.35,<3",
]
dev = [
  "factory-boy>=3.3,<4",
  "pre-commit>=4.3,<5",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "pytest-django>=4.11,<5",
  "ruff>=0.12,<0.16",
]

[tool.hatch.build.targets.wheel]
packages = ["apps", "common", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
addopts = "--strict-markers --strict-config --disable-warnings --cov=apps --cov=common --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
omit = ["*/migrations/*", "*/admin.py", "*/apps.py"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DJ", "S", "RUF"]
ignore = [
  "DJ001", # Nullable strings are intentional for externally sourced data.
  "S101",  # Assertions are idiomatic in tests.
  "S105",  # Test/example settings contain obvious non-secrets.
  "S106",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "ARG"]
"config/settings/*.py" = ["F403", "F405"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
  "factory-boy>=3.3,<4",
  "pre-commit>=4.3,<5",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "pytest-django>=4.11,<5",
  "ruff>=0.12,<0.16",
]
